name = "watchomacho"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain. Requires daylila.com to already be a Zone on your Cloudflare
# account (i.e. your domain's nameservers point at Cloudflare). On deploy,
# wrangler creates the DNS record and the SSL cert automatically — no manual
# DNS setup needed.
routes = [
  { pattern = "watchomacho.daylila.com", custom_domain = true }
]

# Cron fires every hour. Each tick picks up to `cron_max_per_tick` active
# targets whose `next_run_at` has passed and runs their primary skill against
# them (see cronTick in src/agent.ts).
[triggers]
crons = ["0 * * * *"]

# Workers Logs — 7-day retention of console.log + uncaught errors in the
# Cloudflare dashboard (Workers & Pages → watchomacho → Logs). Essential
# when a run dies silently because the isolate hit the CPU cap (Workers Free
# = 10ms CPU per invocation): `wrangler tail` only shows live logs going
# forward, so without this you can't replay a failure after the fact.
# head_sampling_rate = 1 keeps every invocation; lower if log volume becomes
# a cost concern.
[observability]
enabled = true
head_sampling_rate = 1

# Workers AI — for chat + embeddings
[ai]
binding = "AI"

# D1 — structured log of notes and runs
# Create with: wrangler d1 create watchomacho-db
# Then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "watchomacho-db"
database_id = "35a02280-dab6-4d64-be0c-0d5a3b5b484a"

# R2 — stores full markdown reports (one .md per research run).
# Create with: wrangler r2 bucket create watchomacho-reports
[[r2_buckets]]
binding = "REPORTS"
bucket_name = "watchomacho-reports"

# Vectorize — semantic memory so the agent doesn't repeat itself.
# Create with:
#   wrangler vectorize create watchomacho-memory --dimensions=768 --metric=cosine
[[vectorize]]
binding = "MEMORY"
index_name = "watchomacho-memory"

# Durable Object: ResearchRunner — wraps `runResearch` in an alarm handler
# so manual "Run Now" gets a 15-minute wall-clock budget instead of the
# 30-second ctx.waitUntil cap on HTTP requests. One DO instance per target
# slug (via idFromName) for natural serialisation. SQLite backend is
# required for Workers Free — see `new_sqlite_classes` below.
[[durable_objects.bindings]]
name = "RESEARCH_RUNNER"
class_name = "ResearchRunner"

# Migration declaring ResearchRunner with the SQLite backend. Adding the
# class to `new_sqlite_classes` (not `new_classes`) is what makes this
# work on the Free plan. Bump the tag + use `renamed_classes` / etc. if
# the class is ever renamed or removed.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ResearchRunner"]

# Secrets are NOT defined here. Set with:
#   wrangler secret put ADMIN_SECRET    — admin panel password
#   wrangler secret put TAVILY_API_KEY  — Tavily API key (Researcher Free plan
#                                         gives 1000 credits/month)
# Without TAVILY_API_KEY, web-search-backed skills will short-circuit and the
# agent will fall back to LLM-only knowledge (poor for "research" use cases).
